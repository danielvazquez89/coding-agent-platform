quarkus.application.name=coding-agent-platform
quarkus.http.port=8081
quarkus.http.test-port=0

# Active model provider: 'ollama' (local, default) or 'openai-compatible' (OpenAI, OpenRouter, Groq,
# vLLM, llama.cpp, ...). Only the selected provider is exercised; the other stays inert.
agent.model.provider=${AGENT_MODEL_PROVIDER:ollama}
agent.model.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
agent.model.ollama.model=${OLLAMA_MODEL:qwen3:8b}
# Optional context window sent to Ollama as options.num_ctx. The server default is often 4096 tokens,
# which a long agent conversation outgrows; a larger window needs memory for the model and its KV cache.
# 'disabled' leaves the server default in place.
agent.model.ollama.num-ctx=${OLLAMA_NUM_CTX:disabled}
agent.model.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:1200}
# Local models emit malformed tool-call JSON often enough that Ollama answers HTTP 500
# (`error parsing tool call`) instead of a turn; a fresh sample usually decodes. Retries are bounded.
agent.model.ollama.retry.max-attempts=${OLLAMA_RETRY_MAX_ATTEMPTS:5}
agent.model.ollama.retry.initial-backoff-millis=${OLLAMA_RETRY_INITIAL_BACKOFF_MILLIS:1000}
agent.model.ollama.retry.max-backoff-millis=${OLLAMA_RETRY_MAX_BACKOFF_MILLIS:60000}
# OpenAI-compatible endpoint; base-url includes the version segment (e.g. https://api.openai.com/v1).
# 'disabled' means unset: selecting this provider without a base-url and model fails the attempt.
agent.model.openai.base-url=${AGENT_OPENAI_BASE_URL:disabled}
agent.model.openai.model=${AGENT_OPENAI_MODEL:disabled}
# Optional bearer token; leave 'disabled' for local servers that require no key.
agent.model.openai.api-key=${AGENT_OPENAI_API_KEY:disabled}
agent.model.openai.timeout-seconds=${AGENT_OPENAI_TIMEOUT_SECONDS:1200}
# Transient provider responses (HTTP 429 and 5xx) are retried with exponential backoff and jitter so a
# per-minute rate limit does not fail an attempt outright. Hosted free tiers throttle aggressively.
agent.model.openai.retry.max-attempts=${AGENT_OPENAI_RETRY_MAX_ATTEMPTS:5}
agent.model.openai.retry.initial-backoff-millis=${AGENT_OPENAI_RETRY_INITIAL_BACKOFF_MILLIS:1000}
agent.model.openai.retry.max-backoff-millis=${AGENT_OPENAI_RETRY_MAX_BACKOFF_MILLIS:60000}
# Optional shared rate budget for the OpenAI-compatible provider. The budget is one sliding minute of
# request count and estimated input tokens (characters / 4); 'disabled' turns pacing off. A turn waits
# at most max-wait-millis and is then sent anyway, so the retry loop remains the final defence.
agent.model.rate-limit.requests-per-minute=${AGENT_RATE_LIMIT_REQUESTS_PER_MINUTE:disabled}
agent.model.rate-limit.tokens-per-minute=${AGENT_RATE_LIMIT_TOKENS_PER_MINUTE:disabled}
agent.model.rate-limit.max-wait-millis=${AGENT_RATE_LIMIT_MAX_WAIT_MILLIS:60000}
# Characters of conversation history a single model request may carry. Providers reject an oversized
# request outright (Groq's free tier answers a request over its token-per-minute limit with HTTP 413),
# and every tool result is appended to the conversation, so a long run would otherwise become
# impossible to continue. The system and task prompts are never dropped; the oldest tool exchanges are
# replaced with one note when this budget is exceeded. 'disabled' keeps the full history.
agent.model.max-history-characters=${AGENT_MAX_HISTORY_CHARACTERS:24000}
agent.model.cost.input-per-million-usd=${AGENT_MODEL_INPUT_COST_PER_MILLION_USD:0}
agent.model.cost.output-per-million-usd=${AGENT_MODEL_OUTPUT_COST_PER_MILLION_USD:0}

# A ranked, bounded repository map is prepended to the task prompt so the model does not have to
# discover a whole repository one listing at a time. Ranking is lexical (BM25) plus PageRank over
# type references; the map is a heuristic and every result is capped by an entry count and a
# character/4 token estimate. Indexing is bounded by file count, per-file bytes and total bytes.
agent.context.repo-map.enabled=${AGENT_REPO_MAP_ENABLED:true}
agent.context.repo-map.max-tokens=${AGENT_REPO_MAP_MAX_TOKENS:800}
agent.context.repo-map.max-entries=${AGENT_REPO_MAP_MAX_ENTRIES:12}
agent.context.repo-map.max-indexed-files=${AGENT_REPO_MAP_MAX_INDEXED_FILES:4000}
agent.context.repo-map.max-file-bytes=${AGENT_REPO_MAP_MAX_FILE_BYTES:262144}

agent.execution.enabled=${AGENT_EXECUTION_ENABLED:true}
agent.execution.worker.enabled=${AGENT_EXECUTION_WORKER_ENABLED:true}
agent.execution.max-tool-calls=${AGENT_MAX_TOOL_CALLS:24}
agent.execution.max-duration-seconds=${AGENT_MAX_TASK_DURATION_SECONDS:1800}
agent.execution.max-estimated-cost-usd=${AGENT_MAX_TASK_COST_USD:1.0}
# Attempts left RUNNING by a crashed worker are failed once they are older than this. Left 'disabled'
# it defaults to twice the maximum task duration, so a still-executing task is never reaped early.
agent.execution.stale-attempt-timeout-seconds=${AGENT_STALE_ATTEMPT_TIMEOUT_SECONDS:disabled}
# Local repository access stays off until an operator points AGENT_ALLOWED_LOCAL_ROOT at a real directory.
agent.execution.allowed-local-root=${AGENT_ALLOWED_LOCAL_ROOT:disabled}
agent.execution.workspace-root=${AGENT_WORKSPACE_ROOT:${java.io.tmpdir}/coding-agent-platform/workspaces}
agent.execution.docker.maven-image=${AGENT_MAVEN_IMAGE:maven:3.9.13-eclipse-temurin-21-noble}
agent.execution.docker.postgres-image=${AGENT_POSTGRES_IMAGE:postgres:18-alpine}
agent.execution.docker.maven-repository=${AGENT_MAVEN_REPOSITORY:${user.home}/.m2/repository}
agent.execution.docker.maven-cache-volume=${AGENT_MAVEN_CACHE_VOLUME:disabled}
agent.execution.docker.workspace-volume=${AGENT_WORKSPACE_VOLUME:disabled}
agent.execution.docker.database-ready-attempts=${AGENT_DATABASE_READY_ATTEMPTS:40}
agent.execution.docker.database-ready-delay-millis=${AGENT_DATABASE_READY_DELAY_MILLIS:500}
agent.execution.control-plane-url=${AGENT_CONTROL_PLANE_URL:disabled}
# Empty property-file values are treated as missing (Quarkus SRCFG00040), so use a sentinel that
# both the gateway and the Docker runner treat as "not configured" whenever the control plane is off.
agent.execution.control-plane-token=${AGENT_CONTROL_PLANE_TOKEN:disabled}
agent.execution.control-plane-timeout-seconds=${AGENT_CONTROL_PLANE_TIMEOUT_SECONDS:7200}
agent.execution.validation-timeout-seconds=${AGENT_VALIDATION_TIMEOUT_SECONDS:600}

agent.github.pull-requests.enabled=${AGENT_GITHUB_PULL_REQUESTS_ENABLED:false}
agent.github.token=${AGENT_GITHUB_TOKEN:not-configured}
agent.github.allowed-repositories=${AGENT_GITHUB_ALLOWED_REPOSITORIES:not-configured}
agent.github.api-url=${AGENT_GITHUB_API_URL:https://api.github.com}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=coding_agent_app
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/coding_agent_platform

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/coding_agent_platform_test
%test.agent.execution.enabled=false
%test.agent.execution.worker.enabled=false
%test.agent.execution.control-plane-token=test-only-internal-token
%test.agent.execution.workspace-root=.
%test.quarkus.scheduler.enabled=false
