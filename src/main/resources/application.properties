quarkus.application.name=coding-agent-platform
quarkus.http.port=8081
quarkus.http.test-port=0

agent.model.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
agent.model.ollama.model=${OLLAMA_MODEL:qwen2.5-coder:7b}
agent.model.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:120}

agent.execution.enabled=${AGENT_EXECUTION_ENABLED:true}
agent.execution.max-tool-calls=${AGENT_MAX_TOOL_CALLS:24}
agent.execution.allowed-local-root=${AGENT_ALLOWED_LOCAL_ROOT:.}
agent.execution.workspace-root=${AGENT_WORKSPACE_ROOT:${java.io.tmpdir}/coding-agent-platform/workspaces}
agent.execution.docker.maven-image=${AGENT_MAVEN_IMAGE:maven:3.9.13-eclipse-temurin-21-noble}
agent.execution.docker.postgres-image=${AGENT_POSTGRES_IMAGE:postgres:18-alpine}
agent.execution.docker.maven-repository=${AGENT_MAVEN_REPOSITORY:${user.home}/.m2/repository}
agent.execution.validation-timeout-seconds=${AGENT_VALIDATION_TIMEOUT_SECONDS:600}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=coding_agent_app
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/coding_agent_platform

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/coding_agent_platform_test
%test.agent.execution.enabled=false
