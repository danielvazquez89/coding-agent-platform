name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: coding_agent_app
          POSTGRES_PASSWORD: ci-database-password
          POSTGRES_DB: coding_agent_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coding_agent_app -d coding_agent_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_PASSWORD: ci-database-password

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Create the test database
        run: |
          docker run --rm --network host -e PGPASSWORD="$DB_PASSWORD" postgres:18-alpine \
            psql -h 127.0.0.1 -U coding_agent_app -d coding_agent_platform \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE coding_agent_platform_test OWNER coding_agent_app;"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify (tests + coverage gate + Quarkus build)
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore
